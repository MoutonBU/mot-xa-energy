name: Build installer
on:
  push:
    branches: [main]
    paths: ["RELEASE_NUMBER"]
  workflow_dispatch:
permissions:
  contents: write
env:
  REL_REPO: ${{ github.repository }}
  SB_URL: https://erfgsisfvttercpytsnq.supabase.co
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Version files
        shell: bash
        run: |
          VER="$(tr -d ' \r\n' < RELEASE_NUMBER)"
          echo "${VER}" > version.txt
          echo "{\"repo\": \"${REL_REPO}\"}" > app_config.json
          echo "APP_VER=${VER}" >> "$GITHUB_ENV"
      - run: pyinstaller --noconfirm mot_xa_energy.spec
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: installer_out/MOT_XA_Energy_Setup.exe }
      - name: Release
        if: github.ref_type == 'branch'
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          EXTRA=""
          [ "$REL_REPO" = "$GITHUB_REPOSITORY" ] && EXTRA="--target $GITHUB_SHA"
          gh release create "v${APP_VER}" installer_out/MOT_XA_Energy_Setup.exe --repo "$REL_REPO" $EXTRA --title "Version ${APP_VER}" --notes "MOT XA Energy ${APP_VER}"
      - name: Publish to the private update store (Supabase)
        if: github.ref_type == 'branch'
        shell: bash
        env:
          SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SB_SERVICE_KEY" ]; then echo "SUPABASE_SERVICE_KEY secret is not set - skipping"; exit 0; fi
          python scripts/publish_supabase.py installer_out/MOT_XA_Energy_Setup.exe
